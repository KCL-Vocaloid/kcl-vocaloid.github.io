<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>King's College London Vocaloid Society</title>
  <meta name="description" content="London's first Vocaloid society" />
  <meta name="theme-color" content="#0B1B2B" />

  <meta property="og:title" content="KCL Vocaloid Society" />
  <meta property="og:description" content="London's first Vocaloid society" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./assets/kclmiku-refsheet.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="./assets/favicon.ico" />
  <link rel="apple-touch-icon" href="./assets/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --teal-glow:  #39C5BB;   /* Miku teal */
      --teal-hi:    #7DF9F0;   /* lighter accent */
      --teal-deep:  #0FA39A;
      --pink:       #FF6FA0;
      --pink-deep:  #E23A78;
      --ink:        #0B1B2B;
      --night:      #0A1420;
      --paper:      #E6F4F3;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color:#E6F4F3;
      min-height:100vh;
      /* Mostly dark, teal accents */
      background:
        radial-gradient(900px 600px at 12% -5%, rgba(57,197,187,.35), transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(57,197,187,.18), transparent 60%),
        linear-gradient(180deg,#050C13 0%, #0A1420 55%, #08111C 100%);
      background-attachment: fixed;
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }
    .wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display:flex; flex-direction:column; align-items:center;
    }
    .avatar {
      width: 112px; height:112px;
      border-radius: 999px;
      padding: 3px;
      /* Soft teal → pink ring, no glow */
      background: linear-gradient(135deg, #7DF9F0 0%, #39C5BB 45%, #FF9BBF 100%);
    }
    .avatar img {
      width:100%; height:100%; border-radius:999px; object-fit:cover;
      background:#0A1420;
      display:block;
    }
    h1 {
      font-family:"Space Grotesk", Inter, sans-serif;
      font-weight:700;
      font-size: 22px;
      margin: 18px 0 4px;
      letter-spacing: -0.01em;
      text-align:center;
      color:#FFFFFF;
    }
    .email-line {
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size: 13px;
      color: #CFF8F3;
      margin-bottom: 22px;
      padding: 4px 12px;
      background: rgba(57,197,187,.10);
      border: 1px solid rgba(57,197,187,.30);
      border-radius: 999px;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }
    .email-line:hover { background: rgba(57,197,187,.20); border-color: rgba(57,197,187,.55); transform: translateY(-1px); }
    .email-line:focus-visible { outline:none; box-shadow: 0 0 0 3px rgba(57,197,187,.45); }
    .email-line svg { color: var(--teal-glow); }

    .cal {
      width:100%;
      margin: 0 0 22px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(57,197,187,.22);
      box-shadow: 0 10px 30px -18px rgba(0,0,0,.6);
    }
    .cal iframe {
      width:100%;
      height: 320px;
      border:0;
      display:block;
      background: #fff;
    }

    .links {
      width:100%;
      display:flex; flex-direction:column; gap:12px;
    }
    .link {
      display:flex; align-items:center; gap:14px;
      background: rgba(255,255,255,.96);
      color: #0B1B2B;
      border-radius: 16px;
      padding: 12px 18px 12px 12px;
      font-weight: 600;
      font-size: 15px;
      min-height: 60px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      box-shadow: 0 6px 18px -12px rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.6);
      position:relative;
    }
    .link:hover {
      transform: translateY(-2px) scale(1.01);
      background: #ffffff;
      box-shadow: 0 14px 28px -14px rgba(0,0,0,.55);
    }
    .link:focus-visible { outline:none; box-shadow: 0 0 0 3px rgba(255,111,160,.6), 0 0 0 6px rgba(57,197,187,.35); }
    .link .icon {
      width:40px; height:40px; border-radius:10px;
      background:#f4f7f8;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
      overflow:hidden;
    }
    .link .icon img { width:32px; height:32px; object-fit:contain; }
    .link .title { flex:1; text-align:center; padding-right: 40px; line-height:1.25; }
    /* When there's no icon, remove right padding */
    .link.no-icon .title { padding-right: 0; padding-left: 0; }
    .link .arrow { position:absolute; right:14px; top:50%; transform:translateY(-50%); opacity:.4; font-size:14px; color:#0B1B2B; }

    /* Primary link — bright teal fading naturally into a soft pink */
    .link.primary {
      background: linear-gradient(90deg, #7DF9F0 0%, #39C5BB 45%, #FFC7DB 100%);
      color:#0B1B2B;
      border: 1px solid rgba(125,249,240,.55);
      box-shadow:
        0 10px 30px -12px rgba(57,197,187,.55),
        0 0 0 1px rgba(255,111,160,.18);
    }
    .link.primary:hover {
      background: linear-gradient(90deg, #A6FBF3 0%, #4DD3C9 45%, #FFDCE8 100%);
      box-shadow:
        0 14px 34px -12px rgba(57,197,187,.7),
        0 0 0 1px rgba(255,111,160,.35);
    }
    .link.primary .icon { background: rgba(255,255,255,.95); }
    .link.primary .arrow { color:#0B1B2B; opacity:.7; }

    .refsheet {
      width:100%;
      margin-top: 28px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(57,197,187,.22);
      box-shadow: 0 10px 30px -18px rgba(0,0,0,.7);
    }
    .refsheet img { width:100%; height:auto; display:block; }
    .refsheet .cap {
      display:flex; align-items:center; justify-content:center;
      padding: 10px 14px;
      font-size: 12px;
      color: #B5E9E4;
      border-top: 1px solid rgba(57,197,187,.22);
      background: rgba(255,255,255,.03);
    }

    .socials {
      display:flex; gap:14px; margin-top: 24px;
    }
    .socials a {
      width:42px; height:42px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      background: rgba(57,197,187,.10);
      color: #CFF8F3;
      border:1px solid rgba(57,197,187,.30);
      transition: background .2s ease, transform .2s ease, border-color .2s ease, color .2s ease;
    }
    .socials a:hover { background: rgba(57,197,187,.20); border-color: rgba(125,249,240,.65); color:#fff; transform: translateY(-2px); }
    .socials svg { width:20px; height:20px; }

    footer {
      margin-top: 26px;
      font-size: 11px;
      color: rgba(230,244,243,.45);
      text-align:center;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">
      <img src="./assets/favicon.ico" alt="KCLVS logo" />
    </div>
    <h1>King's College London Vocaloid Society</h1>
    <a class="email-line" href="mailto:kclvocaloid@gmail.com">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 6h16v12H4z M4 6l8 7 8-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      kclvocaloid@gmail.com
    </a>

    <div class="cal" aria-label="KCLVS Google Calendar">
      <iframe
        loading="lazy"
        src="https://calendar.google.com/calendar/embed?src=f3928bc720f942a5c52d95a6b5ab4ae432158a5222a675ebabacb6bb103a07b6%40group.calendar.google.com&ctz=Europe%2FLondon"
        title="KCLVS Google Calendar"
        scrolling="no"></iframe>
    </div>

    <div class="links" id="links"></div>

    <!-- Ref sheet: plain image embed, no hyperlink. The <img> uses width:100%; height:auto,
         so swapping the src to any image of any size will still render correctly. -->
    <figure class="refsheet">
      <img src="./assets/kclmiku-refsheet.png" alt="KCL Miku — society mascot reference sheet" loading="lazy" />
      <figcaption class="cap">KCL Miku · society mascot</figcaption>
    </figure>

    <div class="socials" aria-label="Committee links">
      <a href="https://www.linkedin.com/company/kcl-vocaloid-society" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21,21H17V14.25C17,13.19 15.81,12.31 14.75,12.31C13.69,12.31 13,13.19 13,14.25V21H9V9H13V11C13.66,9.93 15.36,9.24 16.5,9.24C19,9.24 21,11.28 21,13.75V21M7,21H3V9H7V21M5,3A2,2 0 0,1 7,5A2,2 0 0,1 5,7A2,2 0 0,1 3,5A2,2 0 0,1 5,3Z"/></svg>
      </a>
      <a href="https://github.com/KCL-Vocaloid" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.26.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.51 11.51 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.565 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
      </a>
    </div>

    <footer>
      Anything not linked here isn't affiliated with us · © <span id="year"></span> KCLVS
    </footer>
  </main>

  <script>
    const links = [
      { title: "Vocal Synth Academic Symposium",             url: "https://kcl-vocaloid.github.io/vocal-synth-symposium/" },
      { title: "About KCLVS / Join us via KCL Students' Union",             url: "https://www.kclsu.org/groups/activities/join/vocaloid/",       icon: "./assets/kclsu.png",      primary: true },
      { title: "Weekly Events · non-KCL entry form",          url: "https://forms.gle/BE3jDYZm9xZ4hP4e7",                          icon: "./assets/googleforms.png" },
      { title: "Discord chat invite",                         url: "https://discord.com/invite/PpMUjWrU3f",                        icon: "./assets/discord.png" },
      { title: "Instagram group chat invite",                 url: "https://ig.me/j/AbZpJJS7xeZKVMFD/",                            icon: "./assets/instagram.png" },
      { title: "Instagram · @kcl.vocaloid",                   url: "https://instagram.com/kcl.vocaloid",                           icon: "./assets/instagram.png" },
      { title: "YouTube · @KCLVocaloid",                      url: "https://www.youtube.com/@KCLVocaloid",                         icon: "./assets/youtube.png" },
      { title: "rednote · KCL Vocaloid (DM for WeChat)",      url: "https://www.xiaohongshu.com/user/profile/66ab83ba000000001d02112d", icon: "./assets/Xiaohongshu.svg" },
      { title: "WhatsApp (event notifications only)",         url: "https://chat.whatsapp.com/KRVET35OpUJ1NWYJqGdRVQ",              icon: "./assets/WhatsApp.png" },
      { title: "Press kit / About us",                        url: "https://drive.google.com/drive/folders/1bP-bN8sAQfUHSixdiGRDGuJ8w7W5nQge" },
      { title: "Other UK Vocaloid societies",                 url: "https://linktr.ee/vocasoc" },
    ];

    const root = document.getElementById('links');
    root.innerHTML = links.map(l => {
      const hasIcon = !!l.icon;
      const iconHtml = hasIcon
        ? `<span class="icon"><img src="${l.icon}" alt="" loading="lazy" /></span>`
        : ``;
      const isExternal = /^https?:/.test(l.url);
      const attrs = isExternal ? 'target="_blank" rel="noopener"' : '';
      const cls = ['link'];
      if (l.primary) cls.push('primary');
      if (!hasIcon) cls.push('no-icon');
      return `
        <a class="${cls.join(' ')}" href="${l.url}" ${attrs}>
          ${iconHtml}
          <span class="title">${l.title}</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>`;
    }).join('');

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
